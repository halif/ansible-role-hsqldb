---
- name: Install Java
  ansible.builtin.apt:
    name: "{{ hsqldb_java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install HSQLDB from repo for Debian and Ubuntu
  ansible.builtin.apt:
    name: "{{ hsqldb_apt_package }}"
    state: present

- name: Create group for hsqldb
  ansible.builtin.group:
    name: "{{ hsqldb_group }}"
    system: true

- name: Create system user for HSQLDB
  ansible.builtin.user:
    name: "{{ hsqldb_user }}"
    group: "{{ hsqldb_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ hsqldb_home }}"
    create_home: false

- name: СCreate directories for db
  ansible.builtin.file:
    path: "{{ hsqldb_data_dir }}"
    state: directory
    owner: "{{ hsqldb_user }}"
    group: "{{ hsqldb_group }}"
    mode: "0750"

- name: Ensure jar-файл HSQLDB present
  ansible.builtin.stat:
    path: "{{ hsqldb_jar_path }}"
  register: hsqldb_jar_stat
  failed_when: not hsqldb_jar_stat.stat.exists

- name: Make unit-file systemd
  ansible.builtin.template:
    src: "{{ hsqldb_service_template }}"
    dest: "/etc/systemd/system/{{ hsqldb_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart hsqldb

- name: Enable and run HSQLDB
  ansible.builtin.systemd:
    name: "{{ hsqldb_service_name }}"
    enabled: "{{ hsqldb_service_enabled }}"
    state: "{{ hsqldb_service_state }}"
    daemon_reload: true
