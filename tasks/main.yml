---
- name: Install CA certificates first
  ansible.builtin.apt:
    name:
      - ca-certificates
      - ca-certificates-java
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Java
  ansible.builtin.apt:
    name: "{{ hsqldb_java_package }}"
    state: present
    update_cache: true

- name: Install HSQLDB from repo for Debian and Ubuntu
  ansible.builtin.apt:
    name: "{{ hsqldb_apt_package }}"
    state: present

- name: Create group for HSQLDB
  ansible.builtin.group:
    name: "{{ hsqldb_group }}"
    system: true

- name: Create system user for HSQLDB
  ansible.builtin.user:
    name: "{{ hsqldb_user }}"
    group: "{{ hsqldb_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ hsqldb_home }}"
    create_home: false

- name: Create directories for HSQLDB data
  ansible.builtin.file:
    path: "{{ hsqldb_data_dir }}"
    state: directory
    owner: "{{ hsqldb_user }}"
    group: "{{ hsqldb_group }}"
    mode: "0750"

- name: Check that HSQLDB jar file exists
  ansible.builtin.stat:
    path: "{{ hsqldb_jar_path }}"
  register: hsqldb_jar_stat

- name: Assert that HSQLDB jar file is present
  ansible.builtin.assert:
    that:
      - hsqldb_jar_stat.stat.exists
    fail_msg: "HSQLDB jar not found at {{ hsqldb_jar_path }}"

- name: Create systemd unit file for HSQLDB
  ansible.builtin.template:
    src: "{{ hsqldb_service_template }}"
    dest: "/etc/systemd/system/{{ hsqldb_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart HSQLDB

- name: Enable and start HSQLDB
  ansible.builtin.systemd:
    name: "{{ hsqldb_service_name }}"
    enabled: "{{ hsqldb_service_enabled }}"
    state: "{{ hsqldb_service_state }}"
    daemon_reload: true
