---
driver:
  name: docker

platforms:
  - name: ubuntu2204-hsqldb
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    override_command: false
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: debian12-hsqldb
    image: "geerlingguy/docker-debian12-ansible:latest"
    override_command: false
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_user: "root"

scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
