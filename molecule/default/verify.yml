---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Check that the HSQLDB service is active
      ansible.builtin.systemd:
        name: hsqldb
      register: _hsqldb_service
      until: _hsqldb_service.status.ActiveState == 'active'
      retries: 12
      delay: 5

    - name: Verify HSQLDB is listening on port 9001
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9001
        timeout: 30
